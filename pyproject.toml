[project]
name = "pin-actions"
version = "0.1.0"
description = "A tool to pin GitHub Actions and Workflows"
readme = "README.md"
keywords = [
  "ci-cd",
  "github-actions",
  "pinning",
  "security",
  "supply-chain",
]
license = { text = "Apache-2.0" }
authors = [
  { name = "Carlos Meza", email = "carlos@digitalr00ts.com" },
]
requires-python = ">=3.14,<4"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "httpx2>=0.28",
  "packaging>=24",
  "pydantic-settings~=2.0",
  "yamlrocks~=0.6.1",
]
urls.Homepage = "https://github.com/drts01/pin-actions"
urls.Issues = "https://github.com/drts01/pin-actions/issues"
urls.Repository = "https://github.com/drts01/pin-actions"
scripts.pin-actions = "pin_actions.core:main"

[dependency-groups]
test = [
  "hypothesis~=6.88",
  "pytest-asyncio~=1.4",
  "pytest-cov~=7.1",
]
docs = [
  "mkdocstrings-python~=2.0",
  "zensical>=0.0.53",
]
build = [
  "build~=1.2",
  "check-wheel-contents>=0.6",
  "twine~=7.0",
]
ci = [
  "tox-gh~=1.8",
  "tox-uv~=1.36",
]
lint = [
  "prek>=0.3.11",
]
profile = [
  "py-spy>=0.4",
  "pytest-benchmark~=5.2",
]
typecheck = [
  "pyrefly~=1.2",
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = [ "tests" ]
format.indent-style = "space"
format.quote-style = "double"
lint.select = [
  "A",     # flake8-builtins
  "ANN",   # flake8-annotations
  "ARG",   # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "BLE",   # flake8-blind-except
  "C4",    # flake8-comprehensions
  "COM",   # flake8-commas
  "D",     # pydocstyle
  "DOC",   # pydoclint
  "E",     # pycodestyle errors
  "EM",    # flake8-errmsg
  "ERA",   # eradicate
  "EXE",   # flake8-executable
  "F",     # pyflakes
  "FURB",  # refurb
  "G",     # flake8-logging-format
  "I",     # isort
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "N",     # pep8-naming
  "PERF",  # Perflint
  "PIE",   # flake8-pie
  "PL",    # Pylint
  "PLC",   # Pylint Convention
  "PLE",   # Pylint Error
  "PLR",   # Pylint Refactor
  "PLW",   # Pylint Warning
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "PYI",   # flake8-pyi
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # ruff-specific
  "S",     # flake8-bandit
  "SIM",   # flake8-simplify
  "SLOT",  # flake8-slots
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
  "YTT",   # flake8-2020
]
lint.ignore = [
  "COM812", # trailing-comma-missing — conflicts with ruff format
  "D203",   # one-blank-line-before-class (conflicts with black)
  "D213",   # multi-line-summary-second-line (conflicts with black)
]
lint.explicit-preview-rules = true
lint.per-file-ignores."scripts/test_*.py" = [
  "ANN",     # flake8-annotations — test signatures use minimal types
  "D",       # pydocstyle — tests don't need comprehensive docstrings
  "I",       # isort — import sorting in test files is flexible
  "PLR2004", # Pylint magic-value-comparison — asserting literal expected values is normal in tests
  "S101",    # flake8-bandit assert_used — assertions in tests expected
  "S105",    # flake8-bandit hardcoded_password_string — test tokens are hardcoded
  "S106",    # flake8-bandit hardcoded_password_func_arg — test token defaults expected
  "S107",    # flake8-bandit hardcoded_password_default — test fixture defaults are intentional
]
lint.per-file-ignores."tests/*" = [
  "ANN",     # flake8-annotations — test signatures use minimal types
  "D",       # pydocstyle — tests don't need comprehensive docstrings
  "I",       # isort — import sorting in test files is flexible
  "PLR2004", # Pylint magic-value-comparison — asserting literal expected values is normal in tests
  "S101",    # flake8-bandit assert_used — assertions in tests expected
  "S105",    # flake8-bandit hardcoded_password_string — test tokens are hardcoded
  "S106",    # flake8-bandit hardcoded_password_func_arg — test token defaults expected
  "S107",    # flake8-bandit hardcoded_password_default — test fixture defaults are intentional
]
lint.per-file-ignores."tests/conftest.py" = [
  "ARG001", # Unused function argument - fixtures must match pytest signatures
  "ARG002", # Unused method argument - class-based fixtures must match signatures
]
lint.pydocstyle.convention = "google"
lint.pylint.max-args = 9
lint.pylint.max-branches = 13
lint.pylint.max-positional-args = 7
lint.preview = true

[tool.interrogate]
fail-under = 100
ignore-semiprivate = true
ignore-private = true
ignore-nested-functions = true
ignore-regex = [ "^mock_.*" ]
exclude = [ "tests/" ]
verbose = 2
style = "google"

[tool.pyrefly]
preset = "strict"
project-includes = [ "src", "scripts" ]
python-version = "3.14"
search-path = [ "scripts" ]

[tool.pytest]
addopts = [
  "--cov",
  "--doctest-modules",
  "--strict-markers",
  "--tb=short",
]
asyncio_mode = "auto"
markers = [
  "benchmark: pytest-benchmark performance tests (opt-in via profile dependency-group)",
  "integration: Tests with mocked external APIs",
  "unit: Fast unit tests with mocked dependencies",
]
testpaths = [ "scripts", "src", "tests" ]

[tool.coverage]
run.source_pkgs = [ "pin_actions" ]
run.omit = [ "**/__pycache__/*", "tests/*" ]
report.exclude_lines = [
  "def __repr__",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]
report.show_missing = true

[tool.tombi]
files.exclude = [
  "pyproject.toml",
  "tox.toml",
]
format.rules.array-bracket-space-width = 1
format.rules.array-comma-space-width = 1
format.rules.inline-table-brace-space-width = 1
format.rules.inline-table-comma-space-width = 1
format.rules.line-width = 120
format.rules.trailing-comment-space-width = 2

[tool.rumdl]
exclude = [ "CHANGELOG.md" ]
output-format = "grouped"
extend-enable = [
  "table-format",                  # MD060
  "nested-code-fence",             # MD070
  "heading-anchor-collision",      # MD080
  "mojibake",                      # MD083
  "invisible-characters",          # MD084
  "paragraph-continuation-indent", # MD085
  "unused-disable-comment",        # MD087
  "quotes-dashes",                 # MD088
]
disable = [
  "no-inline-html", # MD033
  "no-bare-urls",   # MD034"
]
# MD003
heading-style.style = "atx"
# MD013
line-length.line-length = 120
line-length.code_blocks = false
line-length.code_spans = false
line-length.tables = false
line-length.blockquotes = false
line-length.reflow = true
line-length.reflow-mode = "semantic-line-breaks"
per-file-flavor."*.md" = "gfm"
per-file-flavor."docs/**/*.md" = "mkdocs"
per-file-ignores."docs/license.md" = [ "first-line-heading" ]
per-file-ignores."docs/contributing.md" = [ "first-line-heading" ]
# MD060
table-format.style = "aligned"

[tool.ryl]
ignore-from-file = [ ".gitignore" ]
files.yaml = [
  "*.yaml",
  "*.yml",
  ".yamllint",
]
rules.colons = "enable"
rules.commas = "enable"
rules.empty-lines = "enable"
rules.empty-values = "enable"
rules.hyphens = "enable"
rules.key-duplicates = "enable"
rules.key-ordering = "disable"
rules.new-line-at-end-of-file = "enable"
rules.new-lines = "enable"
rules.octal-values = "enable"
rules.trailing-spaces = "enable"
rules.anchors.forbid-duplicated-anchors = true
rules.anchors.forbid-unused-anchors = true
rules.braces.max-spaces-inside = 1
rules.braces.max-spaces-inside-empty = 2
rules.braces.min-spaces-inside-empty = 0
rules.brackets.max-spaces-inside = 1
rules.brackets.max-spaces-inside-empty = 2
rules.brackets.min-spaces-inside-empty = 0
rules.comments.ignore = [ ".github/workflows/*" ]
rules.comments.level = "warning"
rules.comments-indentation.level = "warning"
rules.document-end.present = false
rules.document-start.level = "warning"
rules.document-start.present = false
rules.float-values.forbid-inf = true
rules.float-values.forbid-nan = true
rules.float-values.forbid-scientific-notation = true
rules.float-values.require-numeral-before-decimal = true
rules.indentation.spaces = 2
rules.line-length.allow-non-breakable-inline-mappings = true
rules.line-length.max = 120
rules.quoted-strings.allow-quoted-quotes = true
rules.quoted-strings.check-keys = true
rules.quoted-strings.quote-type = "single"
rules.quoted-strings.required = "only-when-needed"
rules.truthy.ignore = [ ".github/workflows/*" ]
rules.truthy.level = "warning"
