[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.11.9" ]

[project]
name = "pin-actions"
version = "0.1.0"
description = "A tool to pin GitHub Actions and Workflows"
readme = "README.md"
keywords = [
  "ci-cd",
  "github-actions",
  "pinning",
  "security",
  "supply-chain",
]
license = { text = "Apache-2.0" }
authors = [
  { name = "Carlos Meza", email = "carlos@digitalr00ts.com" },
]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "httpx2>=0.28",
  "packaging>=24",
  "pydantic>=2",
  "pydantic-settings>=2",
  "yamlrocks~=0.6.1",
]
optional-dependencies.cache = [ "diskcache-rs>=0.4" ]
urls.Homepage = "https://github.com/drts01/pin-actions"
urls.Issues = "https://github.com/drts01/pin-actions/issues"
urls.Repository = "https://github.com/drts01/pin-actions"
scripts.pin-actions = "pin_actions.core:main"

[dependency-groups]
test = [
  "hypothesis>=6.88",
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "pytest-cov>=7.1",
]
build = [
  "build>=1.2",
  "check-wheel-contents>=0.6",
  "twine>=6",
]
ci = [
  "tox-gh>=1.7.1",
  "tox-uv>=1.35.1",
]
lint = [
  "prek>=0.3.11",
]

[tool.uv]
exclude-newer = "1 week"

[tool.ruff]
target-version = "py314"
line-length = 120
src = [ "tests" ]
format.indent-style = "space"
format.quote-style = "double"
lint.select = [
  "ANN",   # flake8-annotations
  "ARG",   # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "N",     # pep8-naming
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "RET",   # flake8-return
  "RUF",   # ruff-specific
  "S",     # flake8-bandit
  "SIM",   # flake8-simplify
  "TC",    # flake8-type-checking
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
]
lint.per-file-ignores."tests/*" = [
  "ANN",  # flake8-annotations — test signatures use minimal types
  "S101", # flake8-bandit assert_used — assertions in tests expected
  "S105", # flake8-bandit hardcoded_password_string — test tokens are hardcoded
  "S106", # flake8-bandit hardcoded_password_func_arg — test token defaults expected
  "S107", # flake8-bandit hardcoded_password_default — test fixture defaults are intentional
]
lint.per-file-ignores."tests/conftest.py" = [
  "ARG001", # Unused function argument - fixtures must match pytest signatures
  "ARG002", # Unused method argument - class-based fixtures must match signatures
]

[tool.pytest]
addopts = [
  "--cov",
  "--strict-markers",
  "--tb=short",
]
asyncio_mode = "auto"
markers = [
  "integration: Tests with mocked external APIs",
  "unit: Fast unit tests with mocked dependencies",
]
testpaths = [ "tests" ]

[tool.coverage]
run.omit = [ "**/__pycache__/*", "tests/*" ]
run.source_pkgs = [ "pin_actions" ]
report.exclude_lines = [
  "def __repr__",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]
report.show_missing = true
