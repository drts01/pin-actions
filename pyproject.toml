[build-system]
build-backend = "uv_build"
requires = [ "uv-build~=0.12.3" ]

[project]
name = "pin-actions"
version = "0.1.0"
description = "A tool to pin GitHub Actions and Workflows"
readme = "README.md"
keywords = [
  "ci-cd",
  "github-actions",
  "pinning",
  "security",
  "supply-chain",
]
license = { text = "Apache-2.0" }
authors = [
  { name = "Carlos Meza", email = "carlos@digitalr00ts.com" },
]
requires-python = ">=3.14,<4"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "httpx2>=0.28",
  "packaging>=24",
  "pydantic-settings~=2.0",
  "yamlrocks~=0.6.1",
]
urls.Homepage = "https://github.com/drts01/pin-actions"
urls.Issues = "https://github.com/drts01/pin-actions/issues"
urls.Repository = "https://github.com/drts01/pin-actions"
scripts.pin-actions = "pin_actions.core:main"

[dependency-groups]
test = [
  "hypothesis~=6.88",
  "pytest-asyncio~=1.4",
  "pytest-cov~=7.1",
]
docs = [
  # "mkdocstrings[python]>=1",
  "mkdocstrings-python~=2.0",
  "zensical>=0.0.53",
]
build = [
  "build~=1.2",
  "check-wheel-contents>=0.6",
  "twine~=7.0",
]
ci = [
  "tox-gh~=1.8",
  "tox-uv~=1.36",
]
lint = [
  "prek>=0.3.11",
]
profile = [
  "py-spy>=0.4",
  "pytest-benchmark~=5.2",
]
typecheck = [
  "pyrefly~=1.2",
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = [ "tests" ]
format.indent-style = "space"
format.quote-style = "double"
lint.select = [
  "A",     # flake8-builtins
  "ANN",   # flake8-annotations
  "ARG",   # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "BLE",   # flake8-blind-except
  "C4",    # flake8-comprehensions
  "COM",   # flake8-commas
  "D",     # pydocstyle
  "DOC",   # pydoclint
  "E",     # pycodestyle errors
  "EM",    # flake8-errmsg
  "ERA",   # eradicate
  "EXE",   # flake8-executable
  "F",     # pyflakes
  "FURB",  # refurb
  "G",     # flake8-logging-format
  "I",     # isort
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "N",     # pep8-naming
  "PERF",  # Perflint
  "PIE",   # flake8-pie
  "PL",    # Pylint
  "PLC",   # Pylint Convention
  "PLE",   # Pylint Error
  "PLR",   # Pylint Refactor
  "PLW",   # Pylint Warning
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "PYI",   # flake8-pyi
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # ruff-specific
  "S",     # flake8-bandit
  "SIM",   # flake8-simplify
  "SLOT",  # flake8-slots
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
  "YTT",   # flake8-2020
]
lint.ignore = [
  "COM812", # trailing-comma-missing — conflicts with ruff format
  "D203",   # one-blank-line-before-class (conflicts with black)
  "D213",   # multi-line-summary-second-line (conflicts with black)
]
lint.explicit-preview-rules = true
lint.per-file-ignores."scripts/test_*.py" = [
  "ANN",     # flake8-annotations — test signatures use minimal types
  "D",       # pydocstyle — tests don't need comprehensive docstrings
  "I",       # isort — import sorting in test files is flexible
  "PLR2004", # Pylint magic-value-comparison — asserting literal expected values is normal in tests
  "S101",    # flake8-bandit assert_used — assertions in tests expected
  "S105",    # flake8-bandit hardcoded_password_string — test tokens are hardcoded
  "S106",    # flake8-bandit hardcoded_password_func_arg — test token defaults expected
  "S107",    # flake8-bandit hardcoded_password_default — test fixture defaults are intentional
]
lint.per-file-ignores."tests/*" = [
  "ANN",     # flake8-annotations — test signatures use minimal types
  "D",       # pydocstyle — tests don't need comprehensive docstrings
  "I",       # isort — import sorting in test files is flexible
  "PLR2004", # Pylint magic-value-comparison — asserting literal expected values is normal in tests
  "S101",    # flake8-bandit assert_used — assertions in tests expected
  "S105",    # flake8-bandit hardcoded_password_string — test tokens are hardcoded
  "S106",    # flake8-bandit hardcoded_password_func_arg — test token defaults expected
  "S107",    # flake8-bandit hardcoded_password_default — test fixture defaults are intentional
]
lint.per-file-ignores."tests/conftest.py" = [
  "ARG001", # Unused function argument - fixtures must match pytest signatures
  "ARG002", # Unused method argument - class-based fixtures must match signatures
]
lint.pydocstyle.convention = "google"
lint.pylint.max-args = 9
lint.pylint.max-branches = 13
lint.pylint.max-positional-args = 7
lint.preview = true

[tool.interrogate]
fail-under = 100
ignore-semiprivate = true
ignore-private = true
ignore-nested-functions = true
ignore-regex = [ "^mock_.*" ]
exclude = [ "tests/" ]
verbose = 2
style = "google"

[tool.pyrefly]
preset = "strict"
project-includes = [ "src", "scripts" ]
python-version = "3.14"

[tool.pytest]
addopts = [
  "--cov",
  "--doctest-modules",
  "--strict-markers",
  "--tb=short",
]
asyncio_mode = "auto"
markers = [
  "benchmark: pytest-benchmark performance tests (opt-in via profile dependency-group)",
  "integration: Tests with mocked external APIs",
  "unit: Fast unit tests with mocked dependencies",
]
testpaths = [ "tests", "scripts", "src" ]

[tool.coverage]
run.omit = [ "**/__pycache__/*", "tests/*" ]
run.source_pkgs = [ "pin_actions" ]
report.exclude_lines = [
  "def __repr__",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]
report.show_missing = true
