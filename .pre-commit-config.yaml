---
exclude: ^(CHANGELOG\.md|uv\.lock|\.secrets\.baseline|memory-bank)$
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: name-tests-test
        args: [--pytest-test-first]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 321478e58f4938179c6b86e4ddfa923d1547a49b  # frozen: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        stages: [pre-commit]
      - id: ruff-format
      - id: ruff-check
        description: Run `ruff check` with GitHub annotations.
        name: ruff github
        alias: ruff-github
        args: [--output-format=github]
        stages: [manual]
      - id: ruff-check
        description: Run `ruff check` with sarif output.
        name: ruff sarif
        alias: ruff-sarif
        args: [--output-format=sarif, --output-file=ruff.sarif]
        stages: [manual]

  # - repo: https://github.com/returntocorp/semgrep
  #   rev: v1.171.0
  #   hooks:
  #     - id: semgrep
  #       args: [--config=auto, --error, src/]
  #       stages: [manual]

  # - repo: https://github.com/Yelp/detect-secrets
  #   rev: v1.5.0
  #   hooks:
  #     - id: detect-secrets
  #       args: [--baseline, .secrets.baseline]
  #       exclude: |
  #         (?x)^(
  #           \.secrets\.baseline|
  #           \.pytest_cache/|
  #           \.ruff_cache/|
  #           \.venv/|
  #           htmlcov/|
  #           \.coverage|
  #           .*\.egg-info/
  #         )$

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: 2f3dbd354aa118b539dee99d8eed05a83097a199  # frozen: v1.7.12.24
    hooks:
      - id: actionlint
        additional_dependencies:
          - pyflakes>=3.4.0
          - shellcheck-py>=0.11.0.1

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: cef8b8350da46d8114c7e6b7272aebdccdf193ce  # frozen: v1.30.0
    hooks:
      - id: zizmor
        args: [--no-progress, --persona=auditor, --fix]
        stages: [pre-commit]
      - id: zizmor
        name: zizmor github
        alias: zizmor-github
        args: [--no-progress, --persona=auditor, --format=github]
        stages: [manual]
      - id: zizmor
        name: zizmor sarif
        alias: zizmor-sarif
        entry: bash -c 'zizmor --no-progress --persona=auditor --format=sarif . > zizmor.sarif'
        stages: [manual]
        pass_filenames: false

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 3b42b9776870badc9eaffdef9a4a0834b764d87c  # frozen: v2.29.3
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/tox-dev/tox-toml-fmt
    rev: 2863761a0c1b4a6e9fea638b27657b81f400543b  # frozen: v1.10.3
    hooks:
      - id: tox-toml-fmt

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 25d0a52aa8bc0fc242613346792dc8d726c13347  # frozen: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  - repo: https://github.com/econchick/interrogate
    rev: 4894019dc8876092bc9b6d56878798c550fad998  # frozen: 1.7.0
    hooks:
      - id: interrogate
        args: [--config=pyproject.toml]
        exclude: ^tests/
        additional_dependencies: [tomli]

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: 2ded3bc1d8379b49bfe7415ecea01f52a254c67d  # frozen: v1.5.2
    hooks:
      - id: tombi-format

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 9ebb29f982d88ed2cb80409361f06ad8260041f1  # frozen: v0.2.67
    hooks:
      - id: rumdl
        args: [--fix]
        stages: [pre-commit]
      - id: rumdl
        name: rumdl github
        alias: rumdl-github
        args: [--output-format=github]
        stages: [manual]

  - repo: https://github.com/crate-ci/typos
    rev: d43b6c087ac471e2ea7b8af622ff15f05c0c365b  # frozen: v1.50.1
    hooks:
      - id: typos
        args: [--write-changes]

  - repo: https://github.com/owenlamont/ryl-pre-commit
    rev: fc067094423fc9c08be5c87f4424cde335ef4422  # frozen: v0.22.0
    hooks:
      - id: ryl-markdown
        name: ryl
        alias: ryl
        args: [--fix]
        types_or: [yaml, markdown]
        files: .*\.(ya?ml|md|markdown|mdx|qmd|Rmd)$
        stages: [pre-commit]
      - id: ryl-markdown
        name: ryl github
        alias: ryl-github
        types_or: [yaml, markdown]
        files: .*\.(ya?ml|md|markdown|mdx|qmd|Rmd)$
        args: [--format=github]
        stages: [manual]
