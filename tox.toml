[env_run_base]
description = "Run pytest with coverage"
package = "editable"
dependency_groups = [ "test" ]
pass_env = [ "CI", "GITHUB_*" ]
commands = [ [ "pytest", "{posargs}" ] ]

[env.build]
description = "Validate sdist/wheel build, metadata, and installability"
package = "skip"
skip_install = true
dependency_groups = [ "build" ]
commands = [
  [ "python", "-m", "build", "--outdir", "{env_tmp_dir}/dist" ],
  [ "twine", "check", "{env_tmp_dir}/dist/*" ],
  [ "check-wheel-contents", "{env_tmp_dir}/dist" ],
]

[env.docs]
description = "Build documentation site (strict mode)"
package = "skip"
skip_install = true
dependency_groups = [ "docs" ]
commands = [ [ "zensical", { replace = "posargs", default = [ "build" ], extend = true } ] ]

[env.py315]
description = "Canary: Python 3.15 (pre-release, allowed to fail)"
base_python = "python3.15"
ignore_outcome = true

[env.typecheck]
description = "Static type checking with Pyrefly"
package = "editable"
dependency_groups = [ "typecheck" ]
commands = [ [ "pyrefly", { replace = "posargs", default = [ "check" ], extend = true } ] ]

[tox]
env_list = [ "py314", "py314-cache" ]
min_version = "4.22"
