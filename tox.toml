[env_run_base]
runner = "uv-venv-lock-runner"
description = "Run pytest with coverage"
package = "editable"
dependency_groups = [ "test" ]
pass_env = [ "CI", "GITHUB_*" ]
commands = [ [ "pytest", "{posargs}" ] ]
env = { PYTHON_GIL = 0 }

[env.build]
description = "Validate sdist/wheel build, metadata, and installability"
package = "skip"
skip_install = true
dependency_groups = [ "build" ]
commands = [
  [ "python", "-m", "build", "--outdir", "{env_tmp_dir}/dist" ],
  [ "twine", "check", "{env_tmp_dir}/dist/*" ],
  [ "check-wheel-contents", "{env_tmp_dir}/dist" ],
]

[env.docs]
description = "Build documentation site (strict mode)"
package = "skip"
skip_install = true
dependency_groups = [ "docs" ]
commands = [ [ "zensical", { replace = "posargs", default = [ "build" ], extend = true } ] ]

[env.flamegraph]
description = "Generate SVG flamegraph via py-spy (Linux: no sudo; macOS: requires sudo)"
dependency_groups = [ "profile" ]
commands = [
  [
    "py-spy",
    "record",
    "-o",
    "benchmarks/flamegraph.svg",
    "--",
    "python3",
    "benchmarks/bench_scenario.py",
    { replace = "posargs", default = [ "--files", "500" ], extend = true },
  ]
]

[env.lint]
description = "Run all prek/pre-commit hooks"
package = "skip"
skip_install = true
dependency_groups = [ "lint" ]
commands = [ [ "prek", { replace = "posargs", default = [ "run", "-a" ], extend = true } ] ]

[env.profile]
description = "Performance profiling: pytest-benchmark micro-benchmarks + scenario load test"
skip_install = false
dependency_groups = [
  "profile",
  "test",
]
commands = [
  [
    "pytest",
    "-o",
    "addopts=--tb=short",
    "benchmarks/test_benchmarks.py",
    { replace = "posargs", default = [ "--benchmark-only", "--benchmark-json=benchmark.json" ], extend = true },
  ],
  [
    "python3",
    "benchmarks/bench_scenario.py",
    { replace = "posargs", default = [ "--files", "200" ], extend = true }
  ]
]
override_posargs = false

[env.py315]
description = "Canary: Python 3.15 (pre-release, allowed to fail)"
ignore_outcome = true

[env.py315t]
description = "Canary: Python 3.15t (pre-release, allowed to fail)"
ignore_outcome = true

[env.tachyon-py315]
description = "Python 3.15/3.15t Tachyon (profiling.sampling) wall-clock async-aware profiler"
base_python = [ "python3.15" ]
dependency_groups = [ "profile" ]
ignore_outcome = true
commands = [
  [
    "python3",
    "-m",
    "profiling.sampling",
    "run",
    "--mode",
    "wall",
    "--async-aware",
    "--flamegraph",
    "-o",
    "benchmarks/{env_name}.html",
    "benchmarks/bench_scenario.py",
    { replace = "posargs", default = [ "--files", "200" ], extend = true },
  ]
]

[env.tachyon-py315t]
base_python = [ "python3.15t" ]
base = [ "tachyon-py315" ]

[env.typecheck]
description = "Static type checking with Pyrefly"
dependency_groups = [
  "test",
  "typecheck",
]
commands = [ [ "pyrefly", { replace = "posargs", default = [ "check" ], extend = true } ] ]

[tox]
env_list = [ "build", "typecheck", "lint", "py314{,t}" ]
min_version = "4.22"
requires = [ "tox-uv" ]

[gh.python]
"3.15" = [ "py315" ]
"3.15t" = [ "py315t" ]
"3.14t" = [ "py314t" ]
"3.14" = [ "py314", "typecheck", "build" ]
