---
name: CI

on:
  push: {}
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-suffix: lint
          cache-dependency-glob: .pre-commit-config.yaml
      - name: Cache prek environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: lint-${{ hashFiles('prek.toml', '.pre-commit-config.yaml') }}
          restore-keys: |
            lint-
      - name: Run prek
        run: uv run --managed-python --group lint
          prek run --show-diff-on-failure --color=always --all-files --hook-stage manual
        env:
          SKIP: zizmor-sarif,ruff-sarif

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.14'
          - 3.14t
          - '3.15'
          - 3.15t
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ matrix.python-version }}
      - name: Cache Tox Environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tox
          key: tox-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock', 'tox.toml') }}
          restore-keys: |
            tox-${{ matrix.python-version }}-
      - name: Run tox
        run: uv run --group ci tox run
