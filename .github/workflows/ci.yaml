---
name: CI

on:
  push: {}
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      actions: read          # Required by GitHub code-scanning SARIF upload APIs.
      contents: read         # Required to clone the repository.
      security-events: write # Required to upload SARIF to code scanning.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-suffix: lint
          cache-dependency-glob: |
            prek.toml
            .pre-commit-config.yaml
      - name: Cache prek environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: lint-${{ hashFiles('prek.toml', '.pre-commit-config.yaml') }}
          restore-keys: |
            lint-
      - name: Run prek
        run: |
          uv run --managed-python --group lint prek run \
            --show-diff-on-failure \
            --color=always \
            --all-files \
            --hook-stage manual
      - name: Upload Ruff SARIF
        if: always() && hashFiles('ruff.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ruff.sarif
          category: ruff
      - name: Upload Zizmor SARIF
        if: always() && hashFiles('zizmor.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  supply-chain:
    name: Supply chain checks
    runs-on: ubuntu-latest
    permissions:
      actions: read          # Required by GitHub code-scanning SARIF upload APIs.
      contents: read         # Required to clone the repository.
      security-events: write # Required to upload SARIF to code scanning.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Check lockfile is current (CI-only)
        run: uv lock --check
      - name: Run uv audit with lockfile (CI-only)
        id: uv_audit
        continue-on-error: true
        run: uv audit --locked --output-format sarif > uv-audit.sarif
      - name: Upload uv audit SARIF
        if: always() && hashFiles('uv-audit.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: uv-audit.sarif
          category: uv-audit
      - name: Fail if uv audit found vulnerabilities
        if: steps.uv_audit.outcome == 'failure'
        run: |
          echo "::error::uv audit reported one or more vulnerabilities."
          exit 1

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.14'
          - 3.14t
          - '3.15'
          - 3.15t
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ matrix.python-version }}
      - name: Cache tox environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tox
          key: tox-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock', 'tox.toml') }}
          restore-keys: |
            tox-${{ matrix.python-version }}-
      - name: Run tox
        run: uv run --group ci tox run
